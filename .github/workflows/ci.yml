name: Validacao

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q .
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Smoke test dos containers
        run: |
          docker compose up -d
          sleep 8
          if [ "$(docker compose ps --status running --services | wc -l)" -ne 5 ]; then
            docker compose ps
            docker compose logs
            exit 1
          fi
          docker compose ps
      - if: always()
        run: docker compose down -v
