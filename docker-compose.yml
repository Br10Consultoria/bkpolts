services:
  olt-backup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: olt-backup
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./vendors:/app/vendors        # scripts de cada vendor
      - ./common:/app/common           # módulo compartilhado
      - backup-data:/app/backups       # arquivos de backup temporários
      - backup-logs:/app/logs          # logs de execução
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ:-America/Bahia}
    network_mode: host                 # acesso à rede local das OLTs

volumes:
  backup-data:
    driver: local
  backup-logs:
    driver: local
