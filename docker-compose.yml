services:
  olt-backup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: olt-backup
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/app                           # raiz do projeto — git pull reflete imediatamente
      - backup-data:/app/backups         # arquivos de backup temporários (volume persistente)
      - backup-logs:/app/logs            # logs de execução (volume persistente)
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=America/Bahia
    network_mode: host                   # acesso à rede local das OLTs

volumes:
  backup-data:
    driver: local
  backup-logs:
    driver: local
