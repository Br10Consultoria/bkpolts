services:
  olt-backup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: olt-backup
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/app                           # raiz do projeto — git pull reflete imediatamente
      - ${DATACOM_BACKUP_DIR:-backup-data}:/app/backups  # mesmo volume que o serviço tftp escreve
      - backup-logs:/app/logs            # logs de execução (volume persistente)
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=America/Bahia
    network_mode: host                   # acesso à rede local das OLTs

  webui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: olt-backup-webui
    entrypoint: ["python3", "/app/webui/app.py"]
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/app
      - ${DATACOM_BACKUP_DIR:-backup-data}:/app/backups  # mesmo volume do olt-backup
      - backup-logs:/app/logs
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=America/Bahia
    network_mode: host                   # o botão "backup agora" precisa alcançar as OLTs

  tftp:
    build:
      context: ./tftp
      dockerfile: Dockerfile
    container_name: olt-backup-tftp
    restart: unless-stopped
    volumes:
      - ${DATACOM_BACKUP_DIR:-backup-data}:/srv/tftp  # mesmo volume que olt-backup lê em /app/backups
    network_mode: host                   # TFTP negocia a transferência numa porta UDP
                                          # efêmera que não atravessa o NAT do modo bridge

volumes:
  backup-data:
    driver: local
  backup-logs:
    driver: local
